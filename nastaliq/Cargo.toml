[package]
name = "gulzar-shaper"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
#externref = "0.1.0"
wasm-bindgen = "0.2.0"
kurbo = "0.9.0"
harfbuzz-wasm = { path="../harfbuzz-wasm", features=["kurbo"]}

# The module runs in an interpreter that counts the instructions it runs
# (wasm-micro-runtime, inside HarfBuzz), so it is built to run few of them,
# whatever its size.  opt-level 3 is the default here; "s" runs more
# instructions and "z" many more.
[profile.release]
lto = "fat"

# wasm-pack would run wasm-opt on the module, which puts back the local.tee
# that the linker step takes out (see .cargo/config.toml) and gains nothing
# else.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
